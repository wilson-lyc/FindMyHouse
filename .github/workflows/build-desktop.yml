name: Build Desktop Client

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.2.0)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            pkg_target: node20-linux-x64
            artifact_name: FindMyHouse-x86_64-linux.AppImage
            bundle_suffix: AppImage

          - os: macos-latest
            target: aarch64-apple-darwin
            pkg_target: node20-macos-arm64
            artifact_name: FindMyHouse-aarch64-macos.dmg
            bundle_suffix: dmg

          - os: macos-13
            target: x86_64-apple-darwin
            pkg_target: node20-macos-x64
            artifact_name: FindMyHouse-x86_64-macos.dmg
            bundle_suffix: dmg

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg_target: node20-win-x64
            artifact_name: FindMyHouse-x86_64-windows.msi
            bundle_suffix: msi

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config

      - name: Install pkg and sharp for sidecar build
        run: |
          npm install --no-save @yao-pkg/pkg sharp

      - name: Generate application icons
        run: node scripts/generate-icons.mjs

      - name: Build backend sidecar (${{ matrix.target }})
        shell: bash
        run: |
          cd backend
          npx tsc -p tsconfig.json
          npx esbuild src/main.ts \
            --bundle --platform=node --target=node20 \
            --outfile=bundle.cjs \
            --external:better-sqlite3 \
            --external:./node_modules/*.node \
            --tsconfig=tsconfig.json
          cd ..

          mkdir -p src-tauri/binaries

          BACKEND_BINARY="backend-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BACKEND_BINARY="${BACKEND_BINARY}.exe"
          fi

          npx @yao-pkg/pkg backend/bundle.cjs \
            --target node20-${{ matrix.target }} \
            --output "src-tauri/binaries/${BACKEND_BINARY}" \
            --compress Brotli

          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x "src-tauri/binaries/${BACKEND_BINARY}"
          fi

      - name: Build Tauri Desktop App
        run: cargo tauri build --target ${{ matrix.target }}
        env:
          TAURI: true
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_KEYCHAIN: ${{ secrets.APPLE_KEYCHAIN }}

      - name: Locate bundle artifacts
        shell: bash
        run: |
          # The bundle is in one of these locations depending on Rust/Cargo version
          BUNDLE_DIR=$(find src-tauri/target -type d -name "${{ matrix.bundle_suffix }}" 2>/dev/null | head -1)
          if [ -z "$BUNDLE_DIR" ]; then
            echo "Bundle directory not found!"
            find src-tauri/target -name "*.dmg" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" 2>/dev/null || true
            exit 1
          fi
          echo "BUNDLE_DIR=${BUNDLE_DIR}" >> $GITHUB_ENV
          echo "Found bundle at: ${BUNDLE_DIR}"
          ls -la "${BUNDLE_DIR}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ env.BUNDLE_DIR }}/
          if-no-files-found: warn

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.BUNDLE_DIR }}/
          generate_release_notes: true
