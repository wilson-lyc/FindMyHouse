[package]
name = "find-my-house"
version = "0.1.0"
description = "FindMyHouse Desktop Client"
authors = ["wilson"]
edition = "2021"

[lib]
name = "find_my_house_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
